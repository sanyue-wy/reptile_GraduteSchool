<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务监控 · 导师信息采集监控面板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- ==================== Sidebar ==================== -->
    <aside class="sidebar">
      <div class="logo">
        研究生导师采集
        <span>双一流高校 · 机械/自动化类</span>
      </div>
      <a class="nav-item" href="index.html"><span class="nav-icon">📊</span> 总览面板</a>
      <a class="nav-item"       href="schools.html"><span class="nav-icon">🏫</span> 学校列表</a>
      <a class="nav-item"       href="tutors.html"><span class="nav-icon">👨‍🏫</span> 导师数据</a>
      <a class="nav-item active" href="tasks.html"><span class="nav-icon">⚙️</span> 任务监控</a>
      <a class="nav-item"       href="failures.html"><span class="nav-icon">⚠️</span> 失败记录</a>
      <a class="nav-item"       href="config.html"><span class="nav-icon">⚙️</span> 配置管理</a>
      <div class="sidebar-footer">
        v0.2.0 · API 驱动<br>
        <span id="backend-status" style="color:rgba(255,255,255,.5)">检查后端…</span>
      </div>
    </aside>

    <!-- ==================== Main ==================== -->
    <div class="main">
      <header class="topbar">
        <h1>⚙️ 任务监控</h1>
        <div class="topbar-actions">
          <button class="btn btn-outline btn-sm" onclick="loadTasks()">🔄 刷新</button>
          <button class="btn btn-primary btn-sm" onclick="openCrawlModal()">▶ 启动新任务</button>
        </div>
      </header>

      <div class="content" id="content">
        <!-- Loading -->
        <div id="loading-skeleton">
          <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon blue"><div class="skeleton" style="width:48px;height:48px;border-radius:12px"></div></div><div class="stat-info"><h3 class="skeleton" style="width:60px;height:28px"></h3><p class="skeleton" style="width:80px;height:13px;margin-top:4px"></p></div></div>
            <div class="stat-card"><div class="stat-icon green"><div class="skeleton" style="width:48px;height:48px;border-radius:12px"></div></div><div class="stat-info"><h3 class="skeleton" style="width:60px;height:28px"></h3><p class="skeleton" style="width:80px;height:13px;margin-top:4px"></p></div></div>
            <div class="stat-card"><div class="stat-icon amber"><div class="skeleton" style="width:48px;height:48px;border-radius:12px"></div></div><div class="stat-info"><h3 class="skeleton" style="width:60px;height:28px"></h3><p class="skeleton" style="width:80px;height:13px;margin-top:4px"></p></div></div>
            <div class="stat-card"><div class="stat-icon red"><div class="skeleton" style="width:48px;height:48px;border-radius:12px"></div></div><div class="stat-info"><h3 class="skeleton" style="width:60px;height:28px"></h3><p class="skeleton" style="width:80px;height:13px;margin-top:4px"></p></div></div>
          </div>
        </div>

        <div id="dashboard" style="display:none">
          <!-- ===== Stats Cards ===== -->
          <div class="stats-grid">
            <div class="stat-card" onclick="filterTasks('running')">
              <div class="stat-icon amber">⏳</div>
              <div class="stat-info">
                <h3 id="task-running">0</h3>
                <p>进行中</p>
              </div>
            </div>
            <div class="stat-card" onclick="filterTasks('completed')">
              <div class="stat-icon green">✅</div>
              <div class="stat-info">
                <h3 id="task-completed">0</h3>
                <p>已完成</p>
              </div>
            </div>
            <div class="stat-card" onclick="filterTasks('failed')">
              <div class="stat-icon red">❌</div>
              <div class="stat-info">
                <h3 id="task-failed">0</h3>
                <p>失败</p>
              </div>
            </div>
            <div class="stat-card" onclick="filterTasks('queued')">
              <div class="stat-icon blue">⏸️</div>
              <div class="stat-info">
                <h3 id="task-queued">0</h3>
                <p>排队中</p>
              </div>
            </div>
          </div>

          <!-- ===== Task List ===== -->
          <div class="card" style="margin-bottom:24px">
            <div class="card-header">
              <h2>任务列表</h2>
              <div style="display:flex;gap:8px;align-items:center">
                <select id="task-filter" onchange="loadTasks()" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px">
                  <option value="">全部状态</option>
                  <option value="running">进行中</option>
                  <option value="completed">已完成</option>
                  <option value="failed">失败</option>
                  <option value="queued">排队中</option>
                </select>
                <button class="btn btn-outline btn-sm" onclick="loadTasks()">🔄 刷新</button>
                <button class="btn btn-primary btn-sm" onclick="openCrawlModal()">▶ 新建任务</button>
              </div>
            </div>
            <div class="card-body" style="padding:0">
              <div class="table-wrap">
                <table class="full" id="taskTable">
                  <thead>
                    <tr>
                      <th>任务 ID</th>
                      <th>模式</th>
                      <th>学校范围</th>
                      <th>学科/数据源</th>
                      <th>进度</th>
                      <th>状态</th>
                      <th>开始时间</th>
                      <th>耗时</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="taskTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- ===== Real-time Log Stream ===== -->
          <div class="card">
            <div class="card-header">
              <h2>📋 实时日志流</h2>
              <div style="display:flex;gap:8px;align-items:center">
                <select id="log-filter-task" onchange="connectLogStream()" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px">
                  <option value="all">全部任务</option>
                </select>
                <select id="log-filter-level" onchange="filterLogs()" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px">
                  <option value="">全部级别</option>
                  <option value="INFO">INFO</option>
                  <option value="WARN">WARN</option>
                  <option value="ERROR">ERROR</option>
                </select>
                <button class="btn btn-outline btn-sm" onclick="toggleLogPolling()">⏸ 暂停</button>
                <button class="btn btn-outline btn-sm" onclick="clearLogStream()">🗑 清空</button>
                <span id="log-stream-status" style="font-size:12px;color:var(--text-secondary);margin-left:auto">未连接</span>
              </div>
            </div>
            <div class="card-body" style="padding:0;max-height:500px;overflow:auto">
              <div class="log-stream" id="logStream"></div>
            </div>
          </div>

          <!-- ===== Task Detail Modal ===== -->
          <div class="crawl-modal" id="taskDetailModal" style="display:none">
            <div class="crawl-content" style="max-width:900px">
              <div class="crawl-title" id="taskDetailTitle">任务详情</div>
              <div class="card" style="margin-bottom:16px">
                <div class="card-header"><h3>任务信息</h3></div>
                <div class="card-body" id="taskDetailBody">
                  <!-- filled by JS -->
                </div>
              </div>
              <div class="card">
                <div class="card-header"><h3>子任务进度</h3></div>
                <div class="card-body" id="subTaskProgress">
                  <!-- filled by JS -->
                </div>
              </div>
              <div style="margin-top:20px;padding-top:12px;border-top:1px solid var(--border);text-align:right">
                <button class="btn btn-outline" onclick="closeTaskDetailModal()">关闭</button>
              </div>
            </div>
          </div>

          <!-- ===== Crawl Modal ===== -->
          <div class="crawl-modal" id="crawlModal" style="display:none">
            <div class="crawl-content" style="max-width:700px;max-height:90vh;overflow:auto">
              <div class="crawl-title">▶ 启动新采集任务</div>

              <div class="config-section">
                <h4>运行模式</h4>
                <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px">
                  <label style="display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;cursor:pointer">
                    <input type="radio" name="crawl-mode" value="full" checked id="mode-full" style="accent-color:var(--primary)">
                    <span>🚀 全量采集</span>
                    <small style="color:var(--text-secondary);margin-left:8px">自动发现URL→审核→采集（推荐新环境）</small>
                  </label>
                  <label style="display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;cursor:pointer">
                    <input type="radio" name="crawl-mode" value="resume" id="mode-resume">
                    <span>🔄 断点续抓</span>
                    <small style="color:var(--text-secondary);margin-left:8px">跳过已完成，仅采集未完成</small>
                  </label>
                  <label style="display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;cursor:pointer">
                    <input type="radio" name="crawl-mode" value="review" id="mode-review">
                    <span>👁️ 仅审核</span>
                    <small style="color:var(--text-secondary);margin-left:8px">仅打开候选审核界面</small>
                  </label>
                  <label style="display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;cursor:pointer">
                    <input type="radio" name="crawl-mode" value="discover" id="mode-discover">
                    <span>🔍 仅发现</span>
                    <small style="color:var(--text-secondary);margin-left:8px">仅运行URL自动发现</small>
                  </label>
                </div>
              </div>

              <div class="config-section" id="crawl-options" style="display:block">
                <h4>目标学校</h4>
                <select id="crawl-school" style="width:100%">
                  <option value="__all__">全部学校 (112 所)</option>
                </select>
              </div>

              <div class="config-section">
                <h4>学科范围</h4>
                <div style="display:flex;gap:16px">
                  <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" value="mechanical" checked id="c-cat-mech"> 机械类</label>
                  <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" value="automation" checked id="c-cat-auto"> 自动化类</label>
                </div>
              </div>

              <div class="config-section">
                <h4>数据源</h4>
                <div style="display:flex;gap:16px">
                  <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" value="source_a" checked id="c-src-a"> 官网师资页 (Source A)</label>
                  <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" value="source_b" checked id="c-src-b"> 研招网 (Source B)</label>
                </div>
              </div>

              <div class="config-section">
                <h4>年份 & 选项</h4>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                  <input type="number" id="crawl-year" value="2026" min="2020" max="2030" style="padding:8px 12px;border:1px solid var(--border);border-radius:6px">
                  <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="crawl-force"> 强制重新采集 (忽略缓存/进度)</label>
                  <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="crawl-resume" checked> 断点续抓</label>
                  <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="crawl-no-cache"> 禁用缓存</label>
                </div>
              </div>

              <div class="config-section">
                <h4>高级选项</h4>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                  <div>
                    <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px">并发线程数</label>
                    <input type="number" id="crawl-workers" value="4" min="1" max="16" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px">
                  </div>
                  <div>
                    <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px">请求延迟范围 (秒)</label>
                    <div style="display:flex;gap:8px">
                      <input type="number" id="crawl-delay-min" value="1.0" min="0.1" max="10" step="0.5" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px">
                      <span>~</span>
                      <input type="number" id="crawl-delay-max" value="3.0" min="0.1" max="30" step="0.5" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px">
                    </div>
                  </div>
                  <div>
                    <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px">最大重试次数</label>
                    <input type="number" id="crawl-max-retries" value="3" min="1" max="10" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px">
                  </div>
                  <div>
                    <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px">连接超时 (秒)</label>
                    <input type="number" id="crawl-timeout" value="30" min="5" max="120" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px">
                  </div>
                  <div>
                    <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px">缓存天数</label>
                    <input type="number" id="crawl-cache-days" value="7" min="0" max="30" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px">
                  </div>
                  <div>
                    <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px">反爬冷却阈值</label>
                    <input type="number" id="crawl-cooldown-threshold" value="5" min="1" max="20" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px">
                  </div>
                  <div>
                    <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px">冷却等待秒数</label>
                    <input type="number" id="crawl-cooldown-seconds" value="1800" min="60" max="7200" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px">
                  </div>
                  <div>
                    <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px">熔断阈值</label>
                    <input type="number" id="crawl-circuit-threshold" value="5" min="1" max="20" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px">
                  </div>
                </div>
              </div>

              <div style="margin-top:20px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px">
                <button class="btn btn-outline" onclick="closeCrawlModal()">取消</button>
                <button class="btn btn-primary" onclick="startCrawl()">确认启动</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== Scripts ==================== -->
    <script src="components/toast.js"></script>
    <script src="components/badge.js"></script>
    <script src="api.js"></script>
    <script>
      // ===== 全局状态 =====
      let taskSSE = null;
      let logPollTimer = null;
      let logAutoScroll = true;
      let lastLogTimestamp = 0;

      // ===== 初始化 =====
      document.addEventListener("DOMContentLoaded", async () => {
        await checkBackend();
        loadTasks();
        startLogPolling("all");
      });

      // ===== 后端检测 =====
      async function checkBackend() {
        const statusEl = document.getElementById("backend-status");
        try {
          const resp = await fetch(`${API_BASE}/api/overview`, { signal: AbortSignal.timeout(3000) });
          if (resp.ok) {
            statusEl.textContent = "后端在线";
            statusEl.style.color = "rgba(16,185,129,.8)";
            return true;
          }
        } catch {}
        statusEl.textContent = "后端离线";
        statusEl.style.color = "rgba(239,68,68,.8)";
        return false;
      }

      // ===== 任务列表 =====
      async function loadTasks() {
        try {
          const data = await apiCall("/api/tasks");
          renderTaskTable(data.tasks || []);
          updateTaskStats(data.tasks || []);
        } catch (err) {
          showToast(err.message, "error");
        }
      }

      function filterTasks(status) {
        document.getElementById("task-filter").value = status;
        loadTasks();
      }

      function updateTaskStats(tasks) {
        const stats = { running: 0, completed: 0, failed: 0, queued: 0 };
        tasks.forEach(t => { if (stats[t.status] !== undefined) stats[t.status]++; });
        document.getElementById("task-running").textContent = stats.running;
        document.getElementById("task-completed").textContent = stats.completed;
        document.getElementById("task-failed").textContent = stats.failed;
        document.getElementById("task-queued").textContent = stats.queued;
      }

      function renderTaskTable(tasks) {
        const tbody = document.getElementById("taskTableBody");
        const filter = document.getElementById("task-filter").value;

        const filtered = tasks.filter(t => !filter || t.status === filter);

        if (filtered.length === 0) {
          tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-secondary)">暂无任务</td></tr>`;
          return;
        }

        tbody.innerHTML = filtered.map(t => {
          const mode = t.params?.mode || "full";
          const modeLabel = {
            full: "🚀 全量",
            resume: "🔄 续抓",
            review: "👁️ 审核",
            discover: "🔍 发现"
          }[mode] || mode;

          const schools = t.params?.schools || [];
          const schoolLabel = schools.includes("__all__") ? "全部学校" : `${schools.length} 所`;

          const cats = t.params?.categories || [];
          const catLabel = cats.map(c => c === "mechanical" ? "机械" : "自动化").join(",");

          const srcs = t.params?.sources || [];
          const srcLabel = srcs.map(s => s === "source_a" ? "官网" : "研招网").join("+");

          const progress = t.progress || {};
          const pct = progress.total_steps > 0 ? Math.round(progress.completed_steps / progress.total_steps * 100) : 0;

          const elapsed = t.started_at ? formatElapsed(new Date(t.started_at)) : "—";

          const statusBadge = {
            running: '<span class="badge running">⏳ 进行中</span>',
            completed: '<span class="badge success">✅ 已完成</span>',
            failed: '<span class="badge danger">❌ 失败</span>',
            queued: '<span class="badge warning">⏸️ 排队中</span>',
            canceled: '<span class="badge">🚫 已取消</span>',
          }[t.status] || t.status;

          return `
            <tr>
              <td><code style="font-size:11px">${t.task_id}</code></td>
              <td>${modeLabel}</td>
              <td>${schoolLabel}</td>
              <td>${catLabel} / ${srcLabel}</td>
              <td>
                <div class="progress-bar-container" style="width:120px;height:6px">
                  <div class="progress-bar-fill" style="width:${progress.percent || 0}%"></div>
                </div>
                <span style="font-size:11px;color:var(--text-secondary)">${progress.completed_steps || 0}/${progress.total_steps || 0}</span>
              </td>
              <td>${statusBadge}</td>
              <td style="font-size:12px;color:var(--text-secondary)">${formatDateTime(t.started_at)}</td>
              <td style="font-size:12px;color:var(--text-secondary)">${elapsed}</td>
              <td>
                <div style="display:flex;gap:4px">
                  <button class="btn btn-outline btn-xs" onclick="viewTaskDetail('${t.task_id}')" title="查看详情">👁</button>
                  ${t.status === 'running' || t.status === 'queued' ? `<button class="btn btn-danger btn-xs" onclick="cancelTask('${t.task_id}')" title="取消">✕</button>` : ""}
                  ${t.status === 'failed' ? `<button class="btn btn-warning btn-xs" onclick="retryTask('${t.task_id}')" title="重试">🔁</button>` : ""}
                  <button class="btn btn-outline btn-xs" onclick="viewTaskLogs('${t.task_id}')" title="查看日志">📋</button>
                </div>
              </td>
            </tr>
          `}).join("");
        }

      function formatDateTime(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
      }

      function formatElapsed(iso) {
        if (!iso) return "—";
        const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
        if (diff < 60) return `${diff}s`;
        if (diff < 3600) return `${Math.floor(diff/60)}m${diff%60}s`;
        return `${Math.floor(diff/3600)}h${Math.floor((diff%3600)/60)}m`;
      }

      // ===== 任务操作 =====
      async function viewTaskDetail(taskId) {
        try {
          const data = await api.taskProgress(taskId);
          document.getElementById("taskDetailTitle").textContent = `任务详情 - ${taskId}`;

          const p = data.progress || {};
          const body = document.getElementById("taskDetailBody");
          body.innerHTML = `
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
              <div><strong>任务 ID</strong><br><code style="font-size:11px">${data.task_id}</code></div>
              <div><strong>状态</strong><br>${data.status}</div>
              <div><strong>模式</strong><br>${data.params?.mode || "full"}</div>
              <div><strong>学校</strong><br>${data.params?.schools?.join(", ") || "全部"}</div>
              <div><strong>学科</strong><br>${(data.params?.categories || []).join(", ")}</div>
              <div><strong>数据源</strong><br>${(data.params?.sources || []).join(", ")}</div>
              <div><strong>年份</strong><br>${data.params?.year || "—"}</div>
              <div><strong>强制重采</strong><br>${data.params?.force ? "是" : "否"}</div>
              <div><strong>开始时间</strong><br>${formatDateTime(data.started_at)}</div>
            </div>
          `;

          const subBody = document.getElementById("subTaskProgress");
          const progress = data.progress || {};
          subBody.innerHTML = `
            <div style="margin-bottom:16px">
              <div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px">
                总体: ${p.completed_steps || 0} / ${p.total_steps || 0} (${p.percent || 0}%)
              </div>
              <div class="progress-bar-container" style="height:8px">
                <div class="progress-bar-fill" style="width:${p.percent || 0}%"></div>
              </div>
              <div style="font-size:11px;color:var(--text-secondary);margin-top:4px">
                当前: ${p.current_step || "等待开始"}
              </div>
            </div>
          `;

          document.getElementById("taskDetailModal").style.display = "flex";
        } catch (err) {
          showToast(err.message, "error");
        }
      }

      function closeTaskDetailModal() {
        document.getElementById("taskDetailModal").style.display = "none";
      }

      // ===== 爬虫模态框 =====
      function openCrawlModal() {
        // 重置表单
        document.getElementById("crawlModal").style.display = "flex";
        document.querySelector('input[name="crawl-mode"][value="full"]').checked = true;
        toggleCrawlOptions("full");
      }

      function closeCrawlModal() {
        document.getElementById("crawlModal").style.display = "none";
      }

      function toggleCrawlOptions(mode) {
        const optionsDiv = document.getElementById("crawl-options");
        if (mode === "review") {
          optionsDiv.style.display = "none";
        } else if (mode === "discover") {
          optionsDiv.style.display = "block";
          // 简化选项
          document.getElementById("crawl-resume").checked = false;
          document.getElementById("crawl-force").checked = false;
        } else {
          optionsDiv.style.display = "block";
        }
      }

      async function startCrawl() {
        const mode = document.querySelector('input[name="crawl-mode"]:checked').value;

        const schoolsEl = document.getElementById("crawl-school").value;
        const cats = [];
        if (document.getElementById("c-cat-mech").checked) cats.push("mechanical");
        if (document.getElementById("c-cat-auto").checked) cats.push("automation");
        const sources = [];
        if (document.getElementById("c-src-a").checked) sources.push("source_a");
        if (document.getElementById("c-src-b").checked) sources.push("source_b");
        const year = parseInt(document.getElementById("crawl-year").value);
        const force = document.getElementById("crawl-force").checked;
        const resume = document.getElementById("crawl-resume").checked;
        const noCache = document.getElementById("crawl-no-cache").checked;

        const workers = parseInt(document.getElementById("crawl-workers").value);
        const delayMin = parseFloat(document.getElementById("crawl-delay-min").value);
        const delayMax = parseFloat(document.getElementById("crawl-delay-max").value);
        const maxRetries = parseInt(document.getElementById("crawl-max-retries").value);
        const timeout = parseInt(document.getElementById("crawl-timeout").value);
        const cacheDays = parseInt(document.getElementById("crawl-cache-days").value);
        const cooldownThreshold = parseInt(document.getElementById("crawl-cooldown-threshold").value);
        const cooldownSeconds = parseInt(document.getElementById("crawl-cooldown-seconds").value);
        const circuitThreshold = parseInt(document.getElementById("crawl-circuit-threshold").value);

        if (cats.length === 0 || sources.length === 0) {
          showToast("请选择学科和数据源", "warning");
          return;
        }

        try {
          const schoolsVal = document.getElementById("crawl-school").value;
          const schools = schoolsVal === "__all__" ? ["__all__"] : [schoolsVal];

          const data = await api.startCrawl({
            schools: schools,
            categories: cats,
            sources: sources,
            force: force,
            year: document.getElementById("crawl-year").value,
            resume: resume,
            no_cache: noCache,
            workers: workers,
            delay: [delayMin, delayMax],
            max_retries: maxRetries,
            timeout: timeout,
            cache_days: cacheDays,
          });

          closeCrawlModal();
          showToast(data.message || "采集任务已加入队列", "success");

          // 自动打开任务详情
          if (data.task_id) {
            setTimeout(() => viewTaskDetail(data.task_id), 500);
          }
        } catch (err) {
          showToast(err.message, "error");
        }
      }

      // ===== 实时日志流 (SSE) =====
      function setupLogStream(taskId) {
        if (logSSE) {
          logSSE.close();
        }

        const url = taskId === "all"
          ? `${API_BASE}/api/logs/stream`
          : `${API_BASE}/api/logs/stream?task_id=${encodeURIComponent(taskId)}`;

        logSSE = new EventSource(url);

        const statusEl = document.getElementById("log-stream-status");
        const logContainer = document.getElementById("logStream");

        logSSE.onopen = () => {
          statusEl.textContent = "🟢 已连接";
          statusEl.style.color = "var(--success)";
        };

        logSSE.onmessage = (event) => {
          try {
            const log = JSON.parse(event.data);
            appendLog(log);
          } catch (e) {
            // 可能是心跳或非JSON
            appendRawLog(event.data);
          }
        };

        logSSE.onerror = () => {
          statusEl.textContent = "🔴 连接断开，5秒后重连...";
          statusEl.style.color = "var(--danger)";
          setTimeout(() => setupLogStream(document.getElementById("log-filter-task").value), 5000);
        };
      }

      function toggleLogStream() {
        const btn = event.target;
        if (logSSE) {
          logSSE.close();
          logSSE = null;
          btn.textContent = "▶ 继续";
          btn.classList.add("btn-warning");
          document.getElementById("log-stream-status").textContent = "⏸ 已暂停";
        } else {
          setupLogStream(document.getElementById("log-filter-task").value);
          btn.textContent = "⏸ 暂停";
          btn.classList.remove("btn-warning");
        }
      }

      function clearLogStream() {
        document.getElementById("logStream").innerHTML = "";
      }

      function filterLogs() {
        // 客户端过滤已渲染的日志
        const level = document.getElementById("log-filter-level").value;
        document.querySelectorAll("#logStream .log-item").forEach(el => {
          if (!level || el.dataset.level === level) {
            el.style.display = "flex";
          } else {
            el.style.display = "none";
          }
        });
      }

      function appendLog(log) {
        const container = document.getElementById("logStream");
        const time = new Date(log.timestamp || Date.now());
        const timeStr = time.toLocaleTimeString();

        const div = document.createElement("div");
        div.className = "log-item";
        div.dataset.level = log.level;
        div.innerHTML = `
          <span class="log-time">${timeStr}</span>
          <span class="log-level ${log.level}">${log.level}</span>
          <span class="log-task" style="color:var(--primary);margin-right:8px">[${log.task_id?.slice(-8) || "—"}]</span>
          <span class="log-msg">${escapeHtml(log.message)}</span>
        `;

        container.appendChild(div);

        if (logAutoScroll) {
          container.scrollTop = container.scrollHeight;
        }

        // 限制日志条数
        while (container.children.length > 500) {
          container.removeChild(container.firstChild);
        }
      }

      function appendRawLog(text) {
        const container = document.getElementById("logStream");
        const div = document.createElement("div");
        div.className = "log-item";
        div.innerHTML = `<span class="log-time">${new Date().toLocaleTimeString()}</span><span class="log-msg">${escapeHtml(text)}</span>`;
        container.appendChild(div);
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function toggleLogStream() {
        const btn = event.target;
        const taskId = document.getElementById("log-filter-task").value;

        if (logSSE) {
          logSSE.close();
          logSSE = null;
          btn.textContent = "▶ 继续";
          btn.classList.add("btn-warning");
          document.getElementById("log-stream-status").textContent = "⏸ 已暂停";
        } else {
          setupLogStream(taskId);
          btn.textContent = "⏸ 暂停";
          btn.classList.remove("btn-warning");
        }
      }

      function connectLogStream(taskId) {
        setupLogStream(taskId);
        document.querySelector('#log-stream-status').textContent = "🟢 已连接";
        document.querySelector('button[onclick="toggleLogPolling()"]').textContent = "⏸ 暂停";
      }

      // ===== 任务操作 =====
      async function cancelTask(taskId) {
        if (!confirm("确定要取消该任务吗？")) return;
        try {
          await apiCall(`/api/tasks/${encodeURIComponent(taskId)}/cancel`, { method: "POST" });
          showToast("任务已取消", "success");
          loadTasks();
        } catch (err) {
          showToast(err.message, "error");
        }
      }

      async function retryTask(taskId) {
        if (!confirm("确定要重试该失败任务吗？")) return;
        try {
          await apiCall(`/api/tasks/${encodeURIComponent(taskId)}/retry`, { method: "POST" });
          showToast("重试任务已加入队列", "success");
          loadTasks();
        } catch (err) {
          showToast(err.message, "error");
        }
      }

      function viewTaskLogs(taskId) {
        document.getElementById("log-filter-task").value = taskId;
        setupLogStream(taskId);
        document.getElementById("log-stream-status").textContent = "🟢 已连接";
        // 滚动到日志区域
        document.getElementById("logStream").scrollIntoView({ behavior: "smooth" });
      }

      // ===== 工具函数 =====
      async function apiCall(endpoint, options = {}) {
        const url = `${API_BASE}${endpoint}`;
        const config = {
          headers: { "Content-Type": "application/json" },
          ...options,
        };
        const resp = await fetch(url, { ...config, signal: config.signal || AbortSignal.timeout(10000) });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        if (json.code !== 0) throw new Error(json.message || "请求失败");
        return json.data;
      }

      function formatDateTime(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
      }

      function formatDate(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // ===== 初始化 =====
      // 填充学校下拉
      async function populateSchools() {
        try {
          const data = await api.schools({ page_size: 200 });
          const select = document.getElementById("crawl-school");
          data.items.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s.name;
            opt.textContent = `${s.name} (${s.mech_college || ""} / ${s.auto_college || ""})`;
            select.appendChild(opt);
          });
        } catch (err) {
          console.error("加载学校列表失败", err);
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await checkBackend();
        populateSchools();
        loadTasks();
        setupLogStream("all");
      });
    </script>
  </body>
</html>
