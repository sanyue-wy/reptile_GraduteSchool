<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
    <title>Task Definition - Console</title>
    <link rel="stylesheet" href="design-tokens.css">
    <script>
    (function() {
        var t = null;
        try { t = localStorage.getItem('console-theme'); } catch (e) {}
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
    </script>
    <style>
        /* ============================================================
           task-config.html 页面级样式（shadcn 中性极简 + Linear 暗色）
           颜色/字体/间距全部走 design-tokens.css 的 token 变量，
           本页只定义布局与组件形态。旧 class 名保留以兼容 JS 渲染。
           ============================================================ */

        /* ---- 顶栏 ---- */
        .header {
            position: sticky; top: 0; z-index: 50;
            height: var(--header-height, 52px);
            display: flex; align-items: center; gap: var(--space-3);
            padding: 0 var(--space-6);
            background: var(--surface);
            border-bottom: 1px solid var(--divider, var(--border));
        }
        .header h1 {
            font-size: var(--text-lg);
            font-weight: var(--font-weight-semibold, 600);
            color: var(--text-primary);
        }
        .header a {
            color: var(--text-secondary); text-decoration: none;
            font-size: var(--text-sm); transition: color var(--transition-fast);
        }
        .header a:hover { color: var(--text-primary); }

        /* ---- 表单容器 ---- */
        .form-container {
            max-width: 720px;
            margin: var(--space-6) auto;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: var(--space-6);
            box-shadow: var(--shadow-sm);
        }
        .form-container h2 {
            font-size: var(--text-xl);
            font-weight: var(--font-weight-semibold, 600);
            color: var(--text-primary);
            margin-bottom: var(--space-5);
        }

        /* ---- 表单字段 ---- */
        .form-group { margin-bottom: var(--space-4); }
        .form-group label {
            display: block; font-size: var(--text-sm); font-weight: 600;
            color: var(--text-secondary); margin-bottom: var(--space-1);
        }
        .form-group .hint {
            font-size: var(--text-xs); color: var(--text-muted); margin-bottom: var(--space-1);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: var(--space-2) var(--space-3);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: var(--text-sm); font-family: inherit; color: var(--text-primary);
            background: var(--bg-elevated); transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft);
        }
        .form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }

        /* ---- 按钮区 ---- */
        .actions { display: flex; gap: var(--space-3); margin-top: var(--space-5); }
        .actions button {
            padding: var(--space-2) var(--space-5); border: none; border-radius: var(--radius-sm);
            cursor: pointer; font-size: var(--text-sm); font-family: inherit; font-weight: 500;
            transition: background var(--transition-fast), border-color var(--transition-fast);
        }
        .btn-primary { background: var(--accent); color: var(--text-inverse); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary {
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--surface-hover); border-color: var(--border-strong); }

        /* ---- 状态提示 ---- */
        .status {
            margin-top: var(--space-4); padding: var(--space-3); border-radius: var(--radius-sm);
            display: none; font-size: var(--text-sm);
        }
        .status.success { display: block; background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
        .status.error { display: block; background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }

        /* ---- 加载 spinner ---- */
        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            border-top-color: #fff; animation: spin 1s linear infinite; margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html">&larr; Console</a>
        <h1>Task Definition</h1>
    </header>
    <div class="form-container">
        <h2>Define New Task</h2>
        <form id="task-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="dataset">Dataset</label>
                    <div class="hint">Unique dataset identifier</div>
                    <input type="text" id="dataset" name="dataset" required placeholder="e.g., education_tutors_2026" />
                </div>
                <div class="form-group">
                    <label for="source_id">Source ID</label>
                    <div class="hint">Data source identifier</div>
                    <input type="text" id="source_id" name="source_id" required placeholder="e.g., static_faculty" />
                </div>
            </div>
            <div class="form-group">
                <label for="target_url">Target URL</label>
                <div class="hint">Entry point URL for crawling</div>
                <input type="url" id="target_url" name="target_url" required placeholder="https://example.edu/faculty" />
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="profile_id">Profile</label>
                    <select id="profile_id" name="profile_id">
                        <option value="education.tutor.v1">Education Tutor v1</option>
                        <option value="education.major.v1">Education Major v1</option>
                        <option value="generic">Generic</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="spider">Spider Plugin</label>
                    <select id="spider" name="spider">
                        <option value="static_html">Static HTML</option>
                        <option value="ajax_api">AJAX API</option>
                        <option value="js_render">JS Render</option>
                        <option value="pdf_list">PDF List</option>
                        <option value="yzw_api">YZW API</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="force" name="force" value="true" style="margin-right: 0.5rem;">
                    强制采集 (重置状态后重新采集)
                </label>
                <div class="hint">启用后将清除上一轮结果，从头开始采集</div>
            </div>
            <div class="form-group">
                <label for="params">Additional Parameters (JSON)</label>
                <div class="hint">Plugin-specific configuration overrides</div>
                <textarea id="params" name="params" placeholder='{"max_pages": 20, "selectors": {...}}'></textarea>
            </div>
            <div class="actions">
                <button type="submit" class="btn-primary">Validate &amp; Create</button>
                <button type="button" class="btn-secondary" onclick="validateOnly()">Validate Only</button>
            </div>
        </form>
        <div id="status" class="status"></div>
    </div>
    <script src="api.js"></script>
    <script>
    (function() {
        'use strict';

        var FORCE_BANNER = null;
        var RUN_ID = null;

        function escapeHtml(str) {
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function showStatus(msg, isError) {
            var el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + (isError ? 'error' : 'success');
        }

        function showToast(message, isError, duration) {
            duration = duration || 3000;
            if (window.showToast) window.showToast(message, isError, duration);
        }

        function buildPayload() {
            var form = document.getElementById('task-form');
            var force = form.force.checked;
            var params = {};
            var paramsStr = form.params.value.trim();
            if (paramsStr) {
                try { params = JSON.parse(paramsStr); } catch(e) { throw new Error('Invalid JSON in parameters'); }
            }
            return {
                dataset: form.dataset.value,
                source_id: form.source_id.value,
                target_url: form.target_url.value,
                profile_id: form.profile_id.value,
                spider: form.spider.value,
                force: force,
                params: params,
                // 后端契约：sources[] 必填（Console Fix R3.1）
                sources: [{
                    source_id: form.source_id.value,
                    target_url: form.target_url.value,
                    config: Object.assign({ spider: form.spider.value }, params)
                }]
            };
        }

        function checkForceEvent() {
            fetch('/api/run/event', { credentials: 'same-origin' })
                .then(function(r) {
                    if (!r.ok) {
                        if (r.status === 404) return null; // no event yet
                        throw new Error('HTTP ' + r.status);
                    }
                    return r.json();
                })
                .then(function(json) {
                    var data = json && (json.data || {});
                    if (data.exists && data.force === true && data.started_at) {
                        showForceBanner(data.started_at);
                        stopForceEventPolling();
                    }
                })
                .catch(function(err) {
                    console.error('Force event check failed:', err);
                });
        }

        var FORCE_POLL_ID = null;
        function startForceEventPolling() {
            stopForceEventPolling();
            var deadline = Date.now() + 60000;
            FORCE_POLL_ID = setInterval(function() {
                if (Date.now() > deadline) { stopForceEventPolling(); return; }
                checkForceEvent();
            }, 2000);
        }
        function stopForceEventPolling() {
            if (FORCE_POLL_ID) { clearInterval(FORCE_POLL_ID); FORCE_POLL_ID = null; }
        }

        function showForceBanner(startedAt) {
            if (!FORCE_BANNER) {
                FORCE_BANNER = document.createElement('div');
                FORCE_BANNER.style.cssText = 'position:fixed;top:50px;left:0;right:0;background:#fff3cd;color:#856404;padding:12px 2rem;font-size:14px;z-index:1000;border-bottom:1px solid #ffc107;';
                document.body.insertBefore(FORCE_BANNER, document.body.firstChild);
            }
            FORCE_BANNER.textContent = '本轮为强制采集，起始时间 ' + startedAt;
            FORCE_BANNER.style.display = 'block';
        }

        document.getElementById('task-form').addEventListener('submit', function(e) {
            e.preventDefault();
            try {
                var payload = buildPayload();
                var submitBtn = document.querySelector('button[type="submit"]');
                RUN_ID = payload.dataset;

                // 1. 按钮置灰 + spinner
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> 创建中...';
                submitBtn.style.opacity = '0.6';

                // 2. Toast 提示（force 时文案为重置状态）
                if (payload.force) {
                    showToast('强制采集已启动，正在重置状态...', false, 5000);
                } else {
                    showToast('采集任务创建中...', false, 3000);
                }

                // 3. 发送请求
                fetch('/api/pipeline/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload)
                }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
                .then(function(result) {
                    if (result.ok) {
                        var runId = (result.data && result.data.data && result.data.data.run_id) || 'unknown';
                        RUN_ID = runId;
                        showStatus('Task created: run_id=' + runId, false);

                        // 4. 立即拉 run_state 确认
                        setTimeout(function() {
                            fetch('/api/pipeline/runs/' + runId, { credentials: 'same-origin' })
                                .then(function(r) {
                                    if (!r.ok) {
                                        if (r.status === 404) return null; // run not found yet
                                        throw new Error('HTTP ' + r.status);
                                    }
                                    return r.json();
                                })
                                .then(function(data) {
                                    if (data && (data.data || data).status === 'running') {
                                        showToast('正在采集中，进度将实时更新', false, 4000);
                                    }
                                })
                                .catch(function(err) {
                                    console.error('Run state check failed:', err);
                                });
                        }, 1000);

                        // 检查 run_event（force 时后端已写入；每 2s 轮询直至 banner 出现）
                        if (payload.force) {
                            startForceEventPolling();
                        } else {
                            checkForceEvent();
                        }

                        // 5. 开始轮询 run_state
                        if (window.startRunStatePolling) window.startRunStatePolling(runId);
                    } else {
                        showStatus('Error: ' + (result.data.error || result.data.message || 'Validation failed'), true);
                        showToast('任务创建失败: ' + (result.data.error || result.data.message), true, 5000);
                    }
                }).catch(function(err) {
                    showStatus('Request failed: ' + err.message, true);
                    showToast('请求失败: ' + err.message, true, 5000);
                }).finally(function() {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Validate & Create';
                    submitBtn.style.opacity = '1';
                });
            } catch(err) {
                showStatus(err.message, true);
                showToast(err.message, true, 5000);
            }
        });

        // CSS spinner
        var style = document.createElement('style');
        style.textContent = '.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-radius:50%;border-top-color:transparent;animation:spin 1s linear infinite;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}';
        document.head.appendChild(style);

        window.validateOnly = function() {
            try {
                var payload = buildPayload();
                fetch('/api/pipeline/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload)
                }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
                .then(function(result) {
                    if (result.ok) {
                        showStatus('Validation passed', false);
                        showToast('验证通过', false, 2000);
                    } else {
                        showStatus('Validation failed: ' + JSON.stringify(result.data.errors || result.data.message), true);
                        showToast('验证失败', true, 5000);
                    }
                }).catch(function(err) { showStatus('Request failed: ' + err.message, true); });
            } catch(err) { showStatus(err.message, true); }
        };

        // 初始检查 force event
        checkForceEvent();
    })();
    </script>
</body>
</html>
