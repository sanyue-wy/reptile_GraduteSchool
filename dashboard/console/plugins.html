<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
    <title>插件管理 - 控制台</title>
    <link rel="stylesheet" href="design-tokens.css">
    <style>
        /* ============================================================
           plugins.html 页面级样式（shadcn 中性极简 + Linear 暗色）
           颜色/字体/间距全部走 design-tokens.css 的 token 变量，
           本页只定义布局与组件形态。旧 class 名保留以兼容 JS 渲染。
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ---- 顶栏 ---- */
        .header {
            position: sticky; top: 0; z-index: 50;
            height: var(--header-height);
            display: flex; align-items: center; gap: var(--space-3);
            padding: 0 var(--space-6);
            background: var(--surface);
            border-bottom: 1px solid var(--divider);
        }
        .header h1 { font-size: var(--text-lg); font-weight: var(--font-weight-semibold); color: var(--text-primary); }
        .header a {
            color: var(--text-secondary); text-decoration: none;
            font-size: var(--text-sm); transition: color var(--duration-fast) var(--ease-out);
        }
        .header a:hover { color: var(--text-primary); }
        .header .header-spacer { flex: 1; }
        .theme-toggle {
            width: 34px; height: 34px;
            display: inline-flex; align-items: center; justify-content: center;
            border: 1px solid var(--border); border-radius: var(--radius-md);
            background: transparent; color: var(--text-secondary); cursor: pointer;
            font-size: var(--text-base);
            transition: background-color var(--duration-fast) var(--ease-out),
                        color var(--duration-fast) var(--ease-out);
        }
        .theme-toggle:hover { background: var(--surface-hover); color: var(--text-primary); }

        /* ---- 引导条 ---- */
        .guidance {
            padding: var(--space-3) var(--space-6);
            background: var(--info-bg);
            border-bottom: 1px solid var(--divider);
            font-size: var(--text-sm);
            color: var(--info-text);
        }
        .guidance a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
        .guidance a:hover { opacity: 0.8; }

        /* ---- 错误条 ---- */
        .error-msg {
            padding: var(--space-3) var(--space-6);
            background: var(--danger-bg); color: var(--danger-text);
            font-size: var(--text-sm); display: none;
        }

        /* ---- 工具栏 ---- */
        .toolbar {
            padding: var(--space-4) var(--space-6);
            display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap;
            border-bottom: 1px solid var(--divider);
            background: var(--bg);
        }
        .toolbar input[type="text"] {
            width: 300px; max-width: 100%;
            padding: var(--space-2) var(--space-3);
            font-family: inherit; font-size: var(--text-sm);
            color: var(--text-primary);
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-md);
            transition: border-color var(--duration-fast) var(--ease-out),
                        box-shadow var(--duration-fast) var(--ease-out);
        }
        .toolbar input[type="text"]::placeholder { color: var(--text-muted); }
        .toolbar input[type="text"]:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-subtle);
        }
        .toolbar button {
            padding: var(--space-2) var(--space-4);
            font-family: inherit; font-size: var(--text-sm); font-weight: var(--font-weight-medium);
            border: 1px solid var(--border-strong); border-radius: var(--radius-md);
            background: var(--surface); color: var(--text-primary); cursor: pointer;
            transition: background-color var(--duration-fast) var(--ease-out);
        }
        .toolbar button:hover { background: var(--surface-hover); }
        .toolbar button.secondary { border-color: var(--border-strong); }
        .toolbar .reuse-note {
            margin-left: auto;
            font-size: var(--text-xs); color: var(--text-muted);
        }

        /* ---- 分组标签行 ---- */
        .group-label-row {
            display: flex; align-items: baseline; gap: var(--space-3);
            padding: var(--space-5) var(--space-6) 0;
        }
        .group-label-row:first-of-type { padding-top: var(--space-6); }
        .group-title { font-size: var(--text-base); font-weight: var(--font-weight-semibold); color: var(--text-primary); }
        .group-count { font-size: var(--text-xs); color: var(--text-muted); }

        /* ---- 插件卡片网格 ---- */
        #plugin-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--space-4);
            padding: var(--space-4) var(--space-6) var(--space-7);
        }
        #plugin-list > .empty-state { grid-column: 1 / -1; }

        .plugin-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: var(--space-4);
            box-shadow: var(--shadow-sm);
            position: relative;
            display: flex; flex-direction: column;
            transition: box-shadow var(--duration-base) var(--ease-out),
                        border-color var(--duration-base) var(--ease-out);
        }
        .plugin-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }

        .plugin-card-header {
            display: flex; align-items: center; justify-content: space-between;
            gap: var(--space-3); margin-bottom: var(--space-3);
        }
        .plugin-card-title {
            font-size: var(--text-base); font-weight: var(--font-weight-semibold);
            color: var(--text-primary); overflow: hidden;
            white-space: nowrap; text-overflow: ellipsis;
        }

        /* ---- 启用开关 ---- */
        .plugin-card-switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
        .plugin-card-switch input { opacity: 0; width: 0; height: 0; }
        .plugin-card-switch label {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--border-strong); border-radius: var(--radius-full);
            transition: background-color var(--duration-base) var(--ease-out);
        }
        .plugin-card-switch label:before {
            position: absolute; content: ""; height: 16px; width: 16px;
            left: 2px; bottom: 2px; background: #fff; border-radius: 50%;
            transition: transform var(--duration-base) var(--ease-out);
            box-shadow: var(--shadow-sm);
        }
        .plugin-card-switch input:checked + label { background: var(--success); }
        .plugin-card-switch input:checked + label:before { transform: translateX(16px); }
        .plugin-card-switch input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* ---- 徽章 ---- */
        .plugin-badge { display: inline-flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
        .badge {
            font-size: var(--text-xs); font-weight: var(--font-weight-medium);
            padding: 2px var(--space-2); border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--surface-muted); color: var(--text-secondary);
        }
        .badge-status-ok, .badge-approved {
            background: var(--success-bg); color: var(--success-text); border-color: transparent; cursor: default;
        }
        .badge-status-error {
            background: var(--danger-bg); color: var(--danger-text); border-color: transparent;
            cursor: pointer; transition: opacity var(--duration-fast) var(--ease-out);
        }
        .badge-status-error:hover { opacity: 0.8; }
        .badge-pending { background: var(--warning-bg); color: var(--warning-text); border-color: transparent; }
        .badge-disabled { background: var(--danger-bg); color: var(--danger-text); border-color: transparent; }

        /* 类型徽章：单色系描边区分（shadcn 中性路线，不用彩色底） */
        .badge.type-spider     { border-style: solid; }
        .badge.type-processor  { border-style: dashed; }
        .badge.type-storage    { border-style: dotted; }
        .badge.type-presenter  { border-style: double; }
        .badge.type-ui         { border-style: solid; border-color: var(--text-muted); }

        /* ---- 元数据 ---- */
        .plugin-meta {
            font-size: var(--text-xs); color: var(--text-secondary);
            margin-bottom: var(--space-3); line-height: 1.7;
        }
        .plugin-meta span { margin-right: var(--space-4); }
        .plugin-meta strong { color: var(--text-muted); font-weight: var(--font-weight-medium); }

        /* ---- 详情折叠 ---- */
        .collapse-toggle {
            color: var(--text-secondary); font-size: var(--text-xs);
            cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
            transition: color var(--duration-fast) var(--ease-out);
        }
        .collapse-toggle:hover { color: var(--text-primary); }
        .detail-content {
            font-size: var(--text-sm); color: var(--text-secondary);
            line-height: var(--leading-normal); margin-bottom: var(--space-3);
        }
        .detail-content pre {
            background: var(--surface-muted); padding: var(--space-3);
            border-radius: var(--radius-sm); overflow-x: auto;
            font-size: var(--text-xs);
        }

        /* ---- 配置区 ---- */
        .plugin-config {
            margin-top: auto;
            padding-top: var(--space-3);
            border-top: 1px solid var(--divider);
        }
        .plugin-config summary {
            cursor: pointer; color: var(--text-secondary);
            font-size: var(--text-sm); font-weight: var(--font-weight-medium);
            margin-bottom: var(--space-3);
        }
        .config-warning {
            background: var(--warning-bg); border: 1px solid var(--warning);
            border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3);
            margin-bottom: var(--space-3); font-size: var(--text-xs); color: var(--warning-text);
            display: none;
        }
        .config-form { display: flex; flex-direction: column; gap: var(--space-2); }
        .config-form input[type="text"], .config-form input[type="number"],
        .config-form textarea, .config-form select {
            width: 100%; padding: var(--space-2);
            font-family: inherit; font-size: var(--text-sm);
            color: var(--text-primary); background: var(--surface);
            border: 1px solid var(--border-strong); border-radius: var(--radius-md);
        }
        .config-form input:focus, .config-form textarea:focus, .config-form select:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-subtle);
        }
        .config-form textarea { min-height: 60px; resize: vertical; }
        .config-form button {
            padding: var(--space-2) var(--space-3);
            font-family: inherit; font-size: var(--text-xs); font-weight: var(--font-weight-medium);
            background: var(--accent); color: var(--text-on-accent);
            border: none; border-radius: var(--radius-md); cursor: pointer;
            align-self: flex-start;
            transition: background-color var(--duration-fast) var(--ease-out);
        }
        .config-form button:hover { background: var(--accent-hover); }

        /* ---- 操作按钮 ---- */
        .plugin-actions { margin-top: var(--space-3); display: flex; gap: var(--space-2); }
        .plugin-actions button {
            padding: var(--space-1) var(--space-2);
            font-family: inherit; font-size: var(--text-xs);
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text-secondary); border-radius: var(--radius-md); cursor: pointer;
            transition: background-color var(--duration-fast) var(--ease-out),
                        color var(--duration-fast) var(--ease-out);
        }
        .plugin-actions button:hover { background: var(--surface-hover); color: var(--text-primary); }
        .plugin-actions button.error-trigger {
            color: var(--danger-text); border-color: var(--danger);
        }
        .plugin-actions button.error-trigger:hover { background: var(--danger-bg); }

        /* ---- 空状态 ---- */
        .empty-state {
            text-align: center; padding: var(--space-7);
            color: var(--text-muted); font-size: var(--text-sm);
        }

        /* ---- 错误详情抽屉 ---- */
        .error-drawer {
            position: fixed; top: 0; right: 0; width: 420px; max-width: 100vw;
            height: 100vh; background: var(--surface);
            border-left: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            transform: translateX(100%);
            transition: transform var(--duration-base) var(--ease-out);
            z-index: 1000;
        }
        .error-drawer.open { transform: translateX(0); }
        .drawer-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: var(--space-4) var(--space-5);
            border-bottom: 1px solid var(--divider);
        }
        .drawer-header h3 { font-size: var(--text-base); font-weight: var(--font-weight-semibold); color: var(--text-primary); }
        .drawer-close {
            cursor: pointer; font-size: var(--text-xl); line-height: 1;
            color: var(--text-muted); transition: color var(--duration-fast) var(--ease-out);
        }
        .drawer-close:hover { color: var(--text-primary); }
        .drawer-content { padding: var(--space-4) var(--space-5); overflow-y: auto; height: calc(100vh - 64px); }

        .error-item {
            border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: var(--space-3); margin-bottom: var(--space-3);
            background: var(--surface-muted);
        }
        .error-time { font-size: var(--text-xs); color: var(--text-muted); margin-bottom: var(--space-1); }
        .error-code {
            font-family: var(--font-mono); font-size: var(--text-xs);
            background: var(--accent-subtle); padding: 2px 6px;
            border-radius: var(--radius-sm); color: var(--text-primary);
        }
        .error-message { font-size: var(--text-sm); color: var(--text-primary); margin: var(--space-1) 0; }
        .error-suggestion {
            font-size: var(--text-xs); color: var(--info-text);
            background: var(--info-bg); padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-sm); margin-top: var(--space-2);
        }
        .error-traces { margin-top: var(--space-2); }
        .trace-toggle {
            font-size: var(--text-xs); color: var(--text-secondary);
            cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
        }
        .trace-content {
            background: #111114; color: #d4d4d8;
            padding: var(--space-3); border-radius: var(--radius-sm);
            font-family: var(--font-mono); font-size: var(--text-xs);
            margin-top: var(--space-2); display: none;
            overflow-x: auto;
        }
        [data-theme="dark"] .trace-content { background: #0a0a0c; border: 1px solid var(--divider); }
        .error-traces button {
            margin-top: var(--space-2);
            padding: var(--space-1) var(--space-2);
            font-family: inherit; font-size: var(--text-xs);
            background: var(--accent); color: var(--text-on-accent);
            border: none; border-radius: var(--radius-md); cursor: pointer;
        }
        .error-traces button:hover { background: var(--accent-hover); }

        /* ---- 响应式：1280px 以下侧栏语义收敛为顶栏，收窄内容内边距 ---- */
        @media (max-width: 1280px) {
            .header, .guidance, .error-msg, .toolbar,
            .group-label-row, #plugin-list { padding-left: var(--space-4); padding-right: var(--space-4); }
            .toolbar input[type="text"] { width: 220px; }
        }
        @media (max-width: 640px) {
            #plugin-list { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar input[type="text"] { width: 100%; }
            .toolbar .reuse-note { margin-left: 0; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html">&larr; 控制台</a>
        <h1>插件管理</h1>
        <span class="header-spacer"></span>
        <button type="button" id="theme-toggle" class="theme-toggle" title="切换明暗主题">&#9788;</button>
    </header>

    <div class="guidance">
        <strong>复用说明：</strong> 此处插件属于控制台全局资产，任何工程创建任务时均可直接选用；启用后点击卡片下方「配置」展开参数设置。<br>
        <span id="global-error-link" style="display: none;">
            <a href="javascript:void(0)" onclick="showGlobalErrors()">全局错误中心</a>
        </span>
    </div>

    <div id="error" class="error-msg"></div>

    <div class="toolbar">
        <input type="text" id="search" placeholder="按名称或类型搜索插件..." />
        <button id="refresh-btn" class="secondary">刷新</button>
        <span class="reuse-note">全工程共享 · spiders / processors / presenters / storages</span>
    </div>

    <main id="plugin-list" class="plugin-grid">
        <div class="empty-state">正在加载插件…</div>
    </main>

    <!-- 错误详情抽屉 -->
    <div id="error-drawer" class="error-drawer">
        <div class="drawer-header">
            <h3 id="drawer-title">错误详情</h3>
            <span class="drawer-close" onclick="closeDrawer()">&times;</span>
        </div>
        <div class="drawer-content" id="drawer-content">
            <div class="empty-state">选择插件查看错误</div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
    (function() {
        'use strict';
        var API = '/api/plugins';
        var ERRORS_API = '/api/plugins/errors';
        var container = document.getElementById('plugin-list');
        var searchInput = document.getElementById('search');
        var refreshBtn = document.getElementById('refresh-btn');
        var errorDiv = document.getElementById('error');
        var allPlugins = [];
        var pluginErrors = {};

        // 主题切换（优先 localStorage，回退 matchMedia）
        (function initTheme() {
            var toggle = document.getElementById('theme-toggle');
            if (!toggle) return;
            function apply(theme) {
                if (theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    toggle.innerHTML = '&#9788;';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    toggle.innerHTML = '&#9789;';
                }
            }
            var saved = null;
            try { saved = localStorage.getItem('console-theme'); } catch (e) {}
            if (saved === 'dark' || saved === 'light') {
                apply(saved);
            } else {
                apply(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            }
            toggle.addEventListener('click', function() {
                var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                var next = isDark ? 'light' : 'dark';
                apply(next);
                try { localStorage.setItem('console-theme', next); } catch (e) {}
            });
        })();

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function formatDate(ts) {
            if (!ts) return '未知';
            try {
                return new Date(ts).toLocaleString();
            } catch (e) { return ts; }
        }

        function getPluginStatus(errorCount) {
            if (errorCount > 0) return { cls: 'badge-status-error', text: '异常 ' + errorCount };
            return { cls: 'badge-status-ok', text: '正常' };
        }

        function getTypeTagClass(p) {
            var type = (p.plugin_type || p.kind || '').toLowerCase();
            var mapping = { spider: 'type-spider', processor: 'type-processor', storage: 'type-storage', presenter: 'type-presenter', ui: 'type-ui' };
            return mapping[type] || '';
        }

        function getTypeLabel(p) {
            var type = (p.plugin_type || p.kind || '').toLowerCase();
            var labels = {
                spider: '采集器', processor: '处理器',
                storage: '存储', presenter: '呈现器', ui: '界面'
            };
            return labels[type] || (type.replace(/_/g, ' ') || '未分类');
        }

        function renderConfigSchema(plugin) {
            var schema = plugin.config_schema || {};
            var config = plugin.config || {};
            var name = plugin.name || plugin.id || '';
            var hasSchema = schema && Object.keys(schema.properties || {}).length > 0;
            var isConfigured = Object.keys(config).length > 0;
            var showWarning = hasSchema && !isConfigured;

            return '<div class="plugin-config">' +
                '<div class="config-warning"' + (showWarning ? '' : ' style="display:none;"') + '>' +
                '<strong>提示：</strong> 此插件尚未配置，启用后点击下方「配置」按钮进行设置。' +
                '</div>' +
                '<details>' +
                '<summary>配置</summary>' +
                '<div class="config-form">' +
                (hasSchema ? renderFormFields(schema, config, name) :
                 '<p style="color: var(--text-muted); font-size: var(--text-sm); margin-bottom: var(--space-3);">此插件无需额外配置，启用即可生效。</p>') +
                '</div>' +
                '</details>' +
                '</div>';
        }

        function renderFormFields(schema, config, pluginName) {
            var props = schema.properties || {};
            if (Object.keys(props).length === 0) {
                return '<p style="color: var(--text-muted); font-size: var(--text-sm);">此插件无需额外配置，启用即可生效。</p>';
            }

            var fields = [];
            for (var key in props) {
                if (!props.hasOwnProperty(key)) continue;
                var prop = props[key];
                var value = config[key] !== undefined ? config[key] : '';
                fields.push(renderField(key, prop, value, config, pluginName));
            }
            return fields.join('');
        }

        function renderField(name, prop, value, config, pluginName) {
            var label = prop.label || prop.title || name;
            var type = prop.type || 'string';
            var isRequired = prop.required || false;
            var placeholder = prop.placeholder || '';

            var inputHtml = '';
            switch (type) {
                case 'number':
                    inputHtml = '<input type="number" name="' + escapeHtml(name) + '" placeholder="' + escapeHtml(placeholder) + '" value="' + escapeHtml(value) + '">';
                    break;
                case 'boolean':
                    inputHtml = '<input type="checkbox" name="' + escapeHtml(name) + '" ' + (value ? 'checked' : '') + '>';
                    break;
                case 'array':
                case 'object':
                default:
                    inputHtml = '<textarea name="' + escapeHtml(name) + '" placeholder="' + escapeHtml(placeholder || '请输入值...') + '">' + escapeHtml(JSON.stringify(value, null, 2)) + '</textarea>';
                    break;
            }

            return '<div style="margin-bottom: var(--space-3);">' +
                '<label style="display: block; font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-1);">' +
                label + (isRequired ? '<span style="color: var(--danger);"> *</span>' : '') +
                '</label>' + inputHtml +
                '</div>';
        }

        // 分组顺序：spiders → processors → presenters → storages → 其它
        var GROUP_ORDER = ['spider', 'processor', 'presenter', 'storage'];
        var GROUP_TITLES = {
            spider: '采集器 Spiders',
            processor: '处理器 Processors',
            presenter: '呈现器 Presenters',
            storage: '存储 Storages'
        };

        function renderPlugins(plugins) {
            if (!plugins.length) {
                container.innerHTML = '<div class="empty-state">暂无插件</div>';
                return;
            }

            var html = '';
            for (var gi = 0; gi < GROUP_ORDER.length; gi++) {
                var g = GROUP_ORDER[gi];
                var group = plugins.filter(function(p) {
                    return ((p.plugin_type || p.kind || '').toLowerCase()) === g;
                });
                if (!group.length) continue;
                html += '<div class="group-label-row" style="grid-column: 1 / -1;">' +
                    '<span class="group-title">' + GROUP_TITLES[g] + '</span>' +
                    '<span class="group-count">' + group.length + ' 个</span>' +
                    '</div>';
                html += group.map(cardHtml).join('');
            }
            var rest = plugins.filter(function(p) {
                return GROUP_ORDER.indexOf((p.plugin_type || p.kind || '').toLowerCase()) === -1;
            });
            if (rest.length) {
                html += '<div class="group-label-row" style="grid-column: 1 / -1;">' +
                    '<span class="group-title">其它</span>' +
                    '<span class="group-count">' + rest.length + ' 个</span>' +
                    '</div>';
                html += rest.map(cardHtml).join('');
            }
            container.innerHTML = html;
        }

        function cardHtml(p) {
            var name = escapeHtml(p.name || p.id || 'unknown');
            var key = (p.plugin_type || p.kind || '') + ':' + (p.name || p.id || '');
            var errorList = pluginErrors[key] || [];
            var errorCount = errorList.length;
            var statusInfo = getPluginStatus(errorCount);

            return '<div class="plugin-card" id="card-' + name.replace(/[^a-zA-Z0-9]/g, '-') + '">' +
                '<div class="plugin-card-header">' +
                '<h3 class="plugin-card-title">' + name + '</h3>' +
                '<div class="plugin-card-switch">' +
                    '<input type="checkbox" id="switch-' + name.replace(/[^a-zA-Z0-9]/g, '-') + '" ' + (p.enabled !== false ? 'checked' : '') + '>' +
                    '<label for="switch-' + name.replace(/[^a-zA-Z0-9]/g, '-') + '"></label>' +
                '</div>' +
                '</div>' +
                '<div class="plugin-badge">' +
                '<span class="badge type-' + getTypeTagClass(p) + '">' + getTypeLabel(p) + '</span>' +
                '<span class="badge ' + statusInfo.cls + '" onclick="showErrorDrawer(\'' + name + '\')">' + statusInfo.text + '</span>' +
                '<span class="badge ' + (p.approved !== false ? 'badge-approved' : 'badge-pending') + '">' + (p.approved !== false ? '已审核' : '待审核') + '</span>' +
                '<span class="badge ' + (p.enabled !== false ? 'badge-approved' : 'badge-disabled') + '">' + (p.enabled !== false ? '已启用' : '已停用') + '</span>' +
                '</div>' +
                '<div class="plugin-meta">' +
                '<span><strong>版本</strong> ' + escapeHtml(p.version || '—') + '</span>' +
                '<span><strong>作者</strong> ' + escapeHtml(p.author || '—') + '</span>' +
                '<span><strong>安装时间</strong> ' + formatDate(p.installed_at || p.install_time) + '</span>' +
                '</div>' +
                '<div style="margin-bottom: var(--space-3);">' +
                '<a href="javascript:void(0)" class="collapse-toggle" onclick="toggleDetail(this)">展开详情 &#9660;</a>' +
                '</div>' +
                '<div class="detail-content" style="display: none;">' +
                (p.description_long || p.long_description || p.description || '暂无详细介绍') +
                '</div>' +
                renderConfigSchema(p) +
                '<div class="plugin-actions">' +
                '<button onclick="showErrorDrawer(\'' + name + '\')' + (errorCount > 0 ? ' class="error-trigger"' : '') + '>' + (errorCount > 0 ? '查看错误' : '配置') + '</button>' +
                '<button onclick="togglePlugin(\'' + escapeHtml(name) + '\', ' + (p.enabled !== false ? false : true) + ')">' + (p.enabled !== false ? '停用' : '启用') + '</button>' +
                '<button onclick="reloadPlugin(\'' + escapeHtml(name) + '\')">重载</button>' +
                '</div>' +
                '</div>';
        }

        window.showErrorDrawer = function(pluginName) {
            var key = allPlugins.find(function(p) { return p.name === pluginName || p.id === pluginName; });
            if (!key) return;
            var actualKey = (key.plugin_type || key.kind || '') + ':' + (key.name || key.id || '');
            var errorList = pluginErrors[actualKey] || [];
            var drawer = document.getElementById('error-drawer');
            var title = document.getElementById('drawer-title');
            var content = document.getElementById('drawer-content');
            title.textContent = pluginName + ' - 错误详情';

            if (!errorList.length) {
                content.innerHTML = '<div class="empty-state" style="padding: 2rem;">暂无错误记录</div>';
            } else {
                content.innerHTML = errorList.slice(0, 5).map(function(e, i) {
                    return '<div class="error-item">' +
                        '<div class="error-time">' +
                            escapeHtml(e.created_at || e.timestamp || '') + ' · ' +
                            '<span class="error-code">' + escapeHtml(e.code || 'UNKNOWN') + '</span>' +
                        '</div>' +
                        '<p class="error-message">' + escapeHtml(e.message || e.error || '未知错误') + '</p>' +
                        '<div class="error-suggestions">' +
                            '<div class="error-suggestion">' + (e.suggestion || e.advice || '请检查配置或查看文档') + '</div>' +
                        '</div>' +
                        '<div class="error-traces">' +
                            '<span class="trace-toggle" onclick="toggleTrace(this)">显示 Traceback &#9660;</span>' +
                            '<div class="trace-content" id="trace-' + i + '"></div>' +
                            '<button onclick="copyReport(\'' + escapeHtml(JSON.stringify(e).substring(0, 100)) + '\')">复制错误报告</button>' +
                        '</div>' +
                    '</div>';
                }).join('');
            }
            drawer.classList.add('open');
        };

        window.closeDrawer = function() {
            document.getElementById('error-drawer').classList.remove('open');
        };

        window.toggleDetail = function(el) {
            var content = el.previousElementSibling;
            if (!content) return;
            var isDisplayNone = content.style.display === 'none';
            content.style.display = isDisplayNone ? 'block' : 'none';
            el.innerHTML = isDisplayNone ? '收起详情 &#9650;' : '展开详情 &#9660;';
        };

        window.toggleTrace = function(el) {
            var trace = el.nextElementSibling;
            if (!trace) return;
            var isDisplayNone = trace.style.display === 'none';
            trace.style.display = isDisplayNone ? 'block' : 'none';
            el.innerHTML = isDisplayNone ? '隐藏 Traceback &#9650;' : '显示 Traceback &#9660;';
        };

        window.showGlobalErrors = function() {
            var errorItems = Object.keys(pluginErrors).map(function(key) {
                var list = pluginErrors[key];
                return list.map(function(e) {
                    return { plugin: key, code: e.code || 'UNKNOWN', message: e.message || e.error || '未知错误', created_at: e.created_at || e.timestamp, suggestion: e.suggestion || e.advice };
                });
            }).flat().sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });

            if (!errorItems.length) return;

            alert('发现 ' + errorItems.length + ' 条错误\n（点击插件卡片上的「查看错误」按钮查看详情）\n\n最新错误：\n' +
                errorItems.slice(0, 3).map(function(e) { return e.plugin + ': ' + e.message; }).join('\n'));
        };

        window.togglePlugin = function(name, enable) {
            var plugin = allPlugins.find(function(p) { return p.name === name || p.id === name; });
            if (!plugin) return;
            var kind = plugin.plugin_type || plugin.kind || 'presenter';
            var key = kind + ':' + name;
            fetch(API + '/' + encodeURIComponent(key), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ enabled: enable })
            }).then(function() { loadPlugins(); })
            .catch(function(err) { alert('切换失败: ' + err.message); });
        };

        window.reloadPlugin = function(name) {
            var plugin = allPlugins.find(function(p) { return p.name === name || p.id === name; });
            if (!plugin) return;
            var kind = plugin.plugin_type || plugin.kind || 'presenter';
            var key = kind + ':' + name;
            fetch(API + '/' + encodeURIComponent(key) + '/reload', {
                method: 'POST',
                credentials: 'same-origin'
            }).then(function() { loadPlugins(); })
            .catch(function(err) { alert('重载失败: ' + err.message); });
        };

        function loadPlugins() {
            errorDiv.style.display = 'none';
            fetch(API, { credentials: 'same-origin' })
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(data) {
                    allPlugins = Array.isArray(data) ? data : (data.plugins || data.items || data.data || []);
                    loadPluginErrors();
                })
                .catch(function(err) {
                    errorDiv.textContent = '插件加载失败: ' + err.message;
                    errorDiv.style.display = 'block';
                    container.innerHTML = '<div class="empty-state">无法加载插件</div>';
                });
        }

        function loadPluginErrors() {
            fetch(ERRORS_API, { credentials: 'same-origin' })
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(data) {
                    pluginErrors = data.errors || data || {};
                    var hasErrors = Object.keys(pluginErrors).length > 0;
                    document.getElementById('global-error-link').style.display = hasErrors ? 'inline' : 'none';
                    renderPlugins(allPlugins);
                })
                .catch(function(err) {
                    pluginErrors = {};
                    renderPlugins(allPlugins);
                });
        }

        loadPlugins();
    })();
    </script>
</body>
</html>
